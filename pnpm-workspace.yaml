packages:
  - "apps/*"
  - "packages/*"

overrides:
  # Next 15 still pins PostCSS 8.4; retain security fixes on the same major.
  postcss: ^8.5.23
  fast-uri: ^3.1.9

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  '@next/swc-win32-x64-msvc': true

minimumReleaseAgeExclude:
  - '@fastify/multipart@10.1.8'
