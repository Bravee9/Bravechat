# ============================================================
# docker-compose.yml — Local Development Stack
# Discord Clone Project
# ============================================================
# Khởi chạy: docker-compose up -d
# Dừng:      docker-compose down
# Reset DB:  docker-compose down -v (xóa volumes)
# ============================================================

services:
  # ─── Web Frontend / App ───────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/ws}
        NEXT_PUBLIC_USE_MOCKS: "false"
    container_name: discord_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      livekit:
        condition: service_started
    networks:
      - discord_network

  # ─── API Backend (Fastify) ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: discord_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://discord_user:discord_secret_2024@postgres:5432/discord_db
      - REDIS_URL=redis://:redis_secret_2024@redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in .env}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:?Set R2_ENDPOINT_URL in .env}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in .env}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in .env}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - LIVEKIT_TOKEN_TTL_SECONDS=${LIVEKIT_TOKEN_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - discord_network

  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: discord_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - discord_network

  # ─── LiveKit SFU (local development configuration) ───────
  livekit:
    image: livekit/livekit-server:v1.9.0
    container_name: discord_livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - discord_network

  # ─── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: discord_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: discord_db
      POSTGRES_USER: discord_user
      POSTGRES_PASSWORD: discord_secret_2024
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discord_user -d discord_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discord_network

  # ─── Redis Cache + Message Broker ─────────────────────────
  redis:
    image: redis:7-alpine
    container_name: discord_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret_2024 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_2024", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discord_network

  # ─── Redis Commander (DB GUI - Dev only) ──────────────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: discord_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:redis_secret_2024
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - discord_network
    profiles:
      - tools

  # ─── pgAdmin (DB GUI - Dev only) ──────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: discord_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bravechat.dev
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - discord_network
    profiles:
      - tools

# ─── Volumes ──────────────────────────────────────────────
volumes:
  postgres_data:
    name: discord_postgres_data
  redis_data:
    name: discord_redis_data

# ─── Networks ─────────────────────────────────────────────
networks:
  discord_network:
    name: discord_network
    driver: bridge
