# ============================================================
# docker-compose.yml — Hardened Stack Configuration
# Bravechat Project
# ============================================================
# Khởi chạy: docker-compose up -d
# Dừng:      docker-compose down
# Reset DB:  docker-compose down -v (xóa volumes)
# ============================================================

services:
  # ─── Web Frontend / App ───────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/api/ws}
        NEXT_PUBLIC_USE_MOCKS: "false"
    container_name: discord_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
      livekit:
        condition: service_started
    networks:
      - discord_network

  # ─── API Backend (Fastify) ────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: discord_api
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:?Set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-discord_db}
      - REDIS_ENABLED=true
      - REDIS_URL=redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:?Set R2_BUCKET_NAME in .env}
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:?Set R2_ENDPOINT_URL in .env}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID in .env}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY in .env}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - MAX_FILE_SIZE=${MAX_FILE_SIZE:-52428800}
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_URL=http://livekit:7880
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}
      - LIVEKIT_TOKEN_TTL_SECONDS=${LIVEKIT_TOKEN_TTL_SECONDS:-300}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - discord_network

  # ─── Nginx Reverse Proxy (Only Public Entrypoint) ─────────
  nginx:
    image: nginx:alpine
    container_name: discord_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    networks:
      - discord_network

  # ─── LiveKit SFU ──────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:v1.9.0
    container_name: discord_livekit
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    ports:
      - "127.0.0.1:7880:7880/tcp"
      - "7881:7881/tcp"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - discord_network

  # ─── PostgreSQL Database (Internal Network Only) ──────────
  postgres:
    image: postgres:16-alpine
    container_name: discord_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-discord_db}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-discord_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discord_network

  # ─── Redis Cache + Message Broker (Internal Network Only) ─
  redis:
    image: redis:7-alpine
    container_name: discord_redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - discord_network

  # ─── Redis Commander (DB GUI - Dev Localhost Only) ────────
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: discord_redis_ui
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - discord_network
    profiles:
      - tools

  # ─── MinIO S3 Object Storage (Localhost Only) ─────────────
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: discord_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - discord_network
    profiles:
      - storage
      - tools

  minio-init:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: discord_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 \"$MINIO_ROOT_USER\" \"$MINIO_ROOT_PASSWORD\";
      /usr/bin/mc mb --ignore-existing local/bravechat-media;
      /usr/bin/mc anonymous set download local/bravechat-media/avatars;
      /usr/bin/mc anonymous set download local/bravechat-media/banners;
      /usr/bin/mc anonymous set download local/bravechat-media/server-icons;
      /usr/bin/mc anonymous set download local/bravechat-media/server-banners;
      exit 0;
      "
    networks:
      - discord_network
    profiles:
      - storage
      - tools

  # ─── pgAdmin (DB GUI - Dev Localhost Only) ────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: discord_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@bravechat.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - discord_network
    profiles:
      - tools

# ─── Volumes ──────────────────────────────────────────────
volumes:
  postgres_data:
    name: discord_postgres_data
  redis_data:
    name: discord_redis_data
  minio_data:
    name: discord_minio_data

# ─── Networks ─────────────────────────────────────────────
networks:
  discord_network:
    name: discord_network
    driver: bridge
